[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phish-triage"
version = "0.1.0"
description = "Exception-only triage of a user-reported phishing queue, for Microsoft 365 / Defender for Office 365"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["phishing", "soc", "defender", "microsoft-365", "triage", "bec"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
]
# No runtime dependencies on purpose: this runs inside a SOC, and a dependency-free
# tool is one less supply-chain surface to review.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
phish-triage = "phish_triage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
# UP017: `timezone.utc` reads clearly and keeps modules copy-pasteable into older
# environments, which matters for the standalone skill script.
ignore = ["E501", "B008", "UP017"]

[tool.ruff.lint.per-file-ignores]
"skills/**" = ["ALL"]
