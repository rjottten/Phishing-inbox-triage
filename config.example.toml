# Tenant context for the triage engine. Copy to config.toml (git-ignored) and edit.
#
#   phish-triage run --input export.json --config config.toml
#
# Nothing here is a secret. Graph credentials come from the environment
# (GRAPH_TENANT_ID / GRAPH_CLIENT_ID / GRAPH_CLIENT_SECRET) and never from a file
# in the repo.

# Your primary mail domain. Without it the engine cannot tell a lookalike
# (contoso-finance.co) from a subdomain you actually own (benefits.contoso.com),
# which is the single highest-value signal for BEC.
org_domain = "contoso.com"

# Every domain you send from, if you have more than one.
org_domains = ["contoso.com", "contoso.co.uk"]

# Priority accounts: executives and their assistants, board members, finance and
# treasury approvers, payroll, legal, HR with PII access, identity admins. A
# routine-looking phish landing here is an exception because of who it reached.
vip_list = [
  "r.alvarez@contoso.com",
  "p.nakamura@contoso.com",
  "k.osei@contoso.com",
]

# Domains you genuinely correspond with. When one of these is flagged malicious,
# the engine recommends confirming out-of-band and blocking at address level —
# never a domain block. A false positive against a real vendor breaks invoices.
known_partner_domains = [
  "northwind-logistics.com",
  "halvorsen-supply.com",
]

# An AIR investigation still running after this many hours is stuck, not in
# progress, and becomes an ambiguous exception. Hours, not days.
air_stale_hours = 2.0

# Recipient count at which a purge or block stops being routine and the scope
# itself becomes the decision.
campaign_recipient_threshold = 50
large_purge_threshold = 50

# How to record reports from a CSV export that has no source/submission-type
# column. A Defender submissions export only ever contains reported mail, so the
# Report button is the right default; an Advanced Hunting EmailEvents export is all
# mail flow, so set this explicitly there.
# default_reported_via = "outlook_report_button"

# Columns the CSV importer could not place on its own. Run
# `phish-triage inspect --input yourfile.csv` — it lists the headers it did not
# recognise and the field names available here. Overrides win outright.
# [column_map]
# from_address = "Absender"
# subject      = "Betreff"
# reporter     = "Gemeldet von"

# Display-name brands mapped to the domains allowed to send as them. Merged over
# the built-in defaults (Microsoft, DocuSign, LinkedIn, Amazon, and friends) — add
# the SaaS products your staff actually receive mail from.
[brand_domains]
workday = ["workday.com", "myworkday.com"]
concur = ["concursolutions.com"]
