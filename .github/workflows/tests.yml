name: tests

on:
  push:
    branches: [main]
  pull_request:

# Nothing here needs to write to the repo.
permissions:
  contents: read

jobs:
  test:
    name: unit tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest version the scripts support, plus current. No dependencies to
        # install — everything here is stdlib, which is the point.
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Unit tests
        # `unittest discover` exits 0 when it finds nothing, so a moved test
        # directory or a broken import would pass vacuously. Assert a floor.
        # pipefail matters: without it `tee` would swallow a real failure.
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee /tmp/unittest.log
          python - <<'PY'
          import re
          import sys

          with open("/tmp/unittest.log", encoding="utf-8") as fh:
              log = fh.read()
          match = re.search(r"^Ran (\d+) tests?", log, re.M)
          if not match:
              sys.exit("no test count in the unittest output — did discovery run at all?")
          count = int(match.group(1))
          if count < 150:
              sys.exit("only %d tests ran; discovery is probably broken" % count)
          print("ran %d tests" % count)
          PY

      - name: Everything compiles
        run: python -m compileall -q phishing-inbox-triage/scripts tests

      - name: graph_submit CLI starts
        run: python phishing-inbox-triage/scripts/graph_submit.py --help > /dev/null

      - name: triage.py reproduces the golden queue
        # The synthetic queue has a known correct answer (evals.json #1). If the
        # rules drift, this is where it shows before an analyst notices.
        run: |
          python phishing-inbox-triage/scripts/triage.py test-data/mailbox_export.json \
              --format json > /tmp/triage.json
          python - <<'PY'
          import json
          with open("/tmp/triage.json", encoding="utf-8") as fh:
              out = json.load(fh)
          assert out["counts"] == {"exception": 5, "automation_gap": 2, "handled_by_automation": 3}, out["counts"]
          assert out["priorities"] == {"P1": 2, "P2": 3, "P4": 2}, out["priorities"]
          p1 = sorted(r["id"] for r in out["results"] if r["priority"] == "P1")
          assert p1 == ["PHQ-1044", "PHQ-1046"], p1
          print("golden queue ok:", out["counts"])
          PY

      - name: offline tools stay offline
        # The README tells operators triage.py and parse_headers.py cannot reach
        # the network, which is why they are safe to point at a real export. An
        # unenforced claim like that rots, so fail the build if one gains an
        # import that could make a request.
        run: |
          python - <<'PY'
          import ast
          import sys

          NETWORK = {"urllib", "http", "socket", "requests", "httpx", "ftplib",
                     "smtplib", "telnetlib", "xmlrpc", "webbrowser", "asyncio"}
          offenders = []
          for path in ("phishing-inbox-triage/scripts/triage.py",
                       "phishing-inbox-triage/scripts/parse_headers.py"):
              with open(path, encoding="utf-8") as fh:
                  tree = ast.parse(fh.read(), path)
              found = set()
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      found.update(a.name.split(".")[0] for a in node.names)
                  elif isinstance(node, ast.ImportFrom) and node.module:
                      found.add(node.module.split(".")[0])
              hits = sorted(found & NETWORK)
              print("%s: %s" % (path, ", ".join(hits) if hits else "offline"))
              if hits:
                  offenders.append("%s imports %s" % (path, ", ".join(hits)))
          if offenders:
              sys.exit("network-capable imports in an offline tool: " + "; ".join(offenders))
          PY

      - name: graph_submit refuses to run without credentials
        # Must fail cleanly with its own message, not a traceback, and must not
        # have reached a mailbox to find that out.
        run: |
          set +e
          out=$(python phishing-inbox-triage/scripts/graph_submit.py \
                  --mailbox phish@example.invalid --dry-run 2>&1)
          code=$?
          set -e
          echo "$out"
          if [ "$code" -eq 0 ]; then
            echo "::error::expected a non-zero exit when no credentials are set"
            exit 1
          fi
          case "$out" in
            *"no usable credentials"*) ;;
            *) echo "::error::expected the credentials message, got the output above"; exit 1 ;;
          esac


  skill-data:
    name: skill data files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: JSON parses
        run: |
          python - <<'PY'
          import json
          for path in ("phishing-inbox-triage/evals/evals.json",
                       "test-data/mailbox_export.json"):
              with open(path, encoding="utf-8") as fh:
                  json.load(fh)
              print("ok", path)
          PY

      - name: SKILL.md has usable frontmatter
        # A skill whose frontmatter is malformed silently fails to load, which is
        # not the kind of thing a reader notices in review.
        run: |
          python - <<'PY'
          import sys
          text = open("phishing-inbox-triage/SKILL.md", encoding="utf-8").read()
          if not text.startswith("---\n"):
              sys.exit("SKILL.md must open with YAML frontmatter")
          front = text.split("---", 2)[1]
          for key in ("name:", "description:"):
              if key not in front:
                  sys.exit("SKILL.md frontmatter is missing %s" % key)
          print("frontmatter ok")
          PY

      - name: Files SKILL.md points at exist
        run: |
          python - <<'PY'
          import os
          import re
          import sys

          root = "phishing-inbox-triage"
          with open(os.path.join(root, "SKILL.md"), encoding="utf-8") as fh:
              text = fh.read()
          referenced = set(re.findall(r"(?:references|scripts)/[\w.-]+\.(?:md|py)", text))
          if not referenced:
              sys.exit("found no reference paths in SKILL.md — has the regex gone stale?")
          missing = sorted(p for p in referenced if not os.path.exists(os.path.join(root, p)))
          if missing:
              sys.exit("SKILL.md points at files that do not exist: %s" % missing)
          print("all %d referenced paths exist" % len(referenced))
          PY
