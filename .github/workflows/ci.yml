name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The engine: installed as a package, linted, with the full suite.
  test:
    name: engine (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Check the skill bundle is in sync
        run: python tools/sync_skill.py --check

      - name: Test
        # A floor on the collected count: pytest exits 0 on an empty run, so a
        # moved directory or a broken import would otherwise pass vacuously.
        # pipefail matters, or tee would swallow a real failure.
        run: |
          set -o pipefail
          # Plain `pytest`: pyproject already sets addopts = "-q", and a second
          # -q suppresses the summary line this floor check reads.
          pytest 2>&1 | tee /tmp/pytest.log
          python - <<'PY'
          import re
          import sys

          with open("/tmp/pytest.log", encoding="utf-8") as fh:
              log = fh.read()
          match = re.search(r"(\d+) passed", log)
          if not match:
              sys.exit("no test count in the pytest output - did collection run at all?")
          count = int(match.group(1))
          if count < 280:
              sys.exit("only %d tests ran; collection is probably broken" % count)
          print("ran %d tests" % count)
          PY

      - name: Triage the sample queue end to end
        run: |
          phish-triage run --input test-data/mailbox_export.json --format summary
          phish-triage run --input tests/fixtures/submissions_export.csv --format summary

  # The skill bundle ships and runs on its own, so its scripts must work with
  # nothing installed - no package, no pytest, stdlib only. That property is the
  # whole reason those scripts are dependency-free; this job is what keeps it true.
  skill-standalone:
    name: skill scripts, no install (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the verified floor. The previous workflow's matrix included
        # 3.9; the vendored parser is now generated from src/phish_triage/
        # headers.py and 3.9 was not available to check it against, so support
        # is not claimed here rather than asserted untested.
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Unit tests for the skill's scripts, stdlib only
        # Deliberately no `pip install`. Each module is named explicitly so a
        # renamed or moved file fails loudly here rather than silently dropping
        # coverage, which is what an unasserted `discover` would do.
        run: |
          set -o pipefail
          for module in test_parse_headers test_triage test_graph_submit test_collect_export; do
            echo "::group::$module"
            python -m unittest discover -s tests -p "$module.py" -v 2>&1 | tee "/tmp/$module.log"
            python - "$module" /tmp/"$module".log <<'PY'
          import re
          import sys

          module, path = sys.argv[1], sys.argv[2]
          with open(path, encoding="utf-8") as fh:
              log = fh.read()
          match = re.search(r"^Ran (\d+) tests?", log, re.M)
          if not match or int(match.group(1)) == 0:
              sys.exit("%s: discovery found nothing - has the file moved?" % module)
          print("%s: ran %s tests" % (module, match.group(1)))
          PY
            echo "::endgroup::"
          done

      - name: Skill CLIs start with nothing installed
        run: |
          python skills/phishing-inbox-triage/scripts/triage.py --help > /dev/null
          python skills/phishing-inbox-triage/scripts/parse_headers.py --help > /dev/null
          python skills/phishing-inbox-triage/scripts/graph_submit.py --help > /dev/null
          python skills/phishing-inbox-triage/scripts/collect_export.py --help > /dev/null
          # The collector must refuse a configuration that would collect nothing
          # at all, rather than cheerfully writing an empty queue.
          set +e
          python skills/phishing-inbox-triage/scripts/collect_export.py \
              --no-mailbox --no-submissions 2>/dev/null
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "::error::--no-mailbox --no-submissions should be refused"
            exit 1
          fi

      - name: triage.py reproduces the golden queue
        # The synthetic queue has a known correct answer (evals.json #1). If the
        # rules drift, this is where it shows before an analyst notices.
        run: |
          python skills/phishing-inbox-triage/scripts/triage.py \
              test-data/mailbox_export.json --format json > /tmp/triage.json
          python - <<'PY'
          import json
          with open("/tmp/triage.json", encoding="utf-8") as fh:
              out = json.load(fh)
          assert out["counts"] == {"exception": 5, "automation_gap": 2, "handled_by_automation": 3}, out["counts"]
          assert out["priorities"] == {"P1": 2, "P2": 3, "P4": 2}, out["priorities"]
          p1 = sorted(r["id"] for r in out["results"] if r["priority"] == "P1")
          assert p1 == ["PHQ-1044", "PHQ-1046"], p1
          print("golden queue ok:", out["counts"])
          PY

      - name: offline tools stay offline
        # The README tells operators triage.py and parse_headers.py cannot reach
        # the network, which is why they are safe to point at a real export. An
        # unenforced claim like that rots, so fail the build if one gains an
        # import that could make a request.
        run: |
          python - <<'PY'
          import ast
          import sys

          NETWORK = {"urllib", "http", "socket", "requests", "httpx", "ftplib",
                     "smtplib", "telnetlib", "xmlrpc", "webbrowser", "asyncio"}
          offenders = []
          for path in ("skills/phishing-inbox-triage/scripts/triage.py",
                       "skills/phishing-inbox-triage/scripts/parse_headers.py"):
              with open(path, encoding="utf-8") as fh:
                  tree = ast.parse(fh.read(), path)
              found = set()
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      found.update(a.name.split(".")[0] for a in node.names)
                  elif isinstance(node, ast.ImportFrom) and node.module:
                      found.add(node.module.split(".")[0])
              hits = sorted(found & NETWORK)
              print("%s: %s" % (path, ", ".join(hits) if hits else "offline"))
              if hits:
                  offenders.append("%s imports %s" % (path, ", ".join(hits)))
          if offenders:
              sys.exit("network-capable imports in an offline tool: " + "; ".join(offenders))
          PY

      - name: graph_submit refuses to run without credentials
        # Must fail cleanly with its own message, not a traceback, and must not
        # have reached a mailbox to find that out.
        run: |
          set +e
          out=$(python skills/phishing-inbox-triage/scripts/graph_submit.py \
                  --mailbox phish@example.invalid --dry-run 2>&1)
          code=$?
          set -e
          echo "$out"
          if [ "$code" -eq 0 ]; then
            echo "::error::expected a non-zero exit when no credentials are set"
            exit 1
          fi
          case "$out" in
            *"no usable credentials"*) ;;
            *) echo "::error::expected the credentials message, got the output above"; exit 1 ;;
          esac
